name: AutoCare Frontend CI/CD

on:
  push:
    branches:
      - dev
      - uat
      - main

  pull_request:
    branches:
      - dev
      - uat
      - main

permissions:
  contents: read
  id-token: write

env:
  ACR_LOGIN_SERVER: acrazureproject.azurecr.io
  ACR_NAME: acrazureproject
  IMAGE_NAME: autocare-frontend
  AZURE_RESOURCE_GROUP: rg-azure-aks
  AKS_CLUSTER_NAME: aks-azure-project

jobs:

  # ============================================================
  # STAGE 1 - VALIDATE
  # ============================================================
  validate:
    name: Stage 1 - Validate
    runs-on: autocare-frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build


  # ============================================================
  # STAGE 2 - KUBERNETES VALIDATION
  # ============================================================
  k8s-validation:
    name: Stage 2 - Kubernetes Validation
    needs: validate
    runs-on: autocare-frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate DEV Kustomize overlay
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/frontend-dev.yaml

      - name: Validate UAT Kustomize overlay
        run: |
          kubectl kustomize k8s/overlays/uat > /tmp/frontend-uat.yaml

      - name: Validate PROD Kustomize overlay
        run: |
          kubectl kustomize k8s/overlays/prod > /tmp/frontend-prod.yaml

      - name: Verify Dockerfile
        shell: bash
        run: |
          test -f Dockerfile
          echo "Dockerfile found."


  # ============================================================
  # STAGE 3 - BUILD AND PUSH IMAGE
  # ============================================================
  build-and-push:
    name: Stage 3 - Build and Push Image
    needs: k8s-validation
    if: github.event_name == 'push'
    runs-on: autocare-frontend

    outputs:
      environment: ${{ steps.environment.outputs.environment }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine environment
        id: environment
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              ENVIRONMENT=dev
              ;;
            uat)
              ENVIRONMENT=uat
              ;;
            main)
              ENVIRONMENT=prod
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

          echo "Environment: ${ENVIRONMENT}"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: Generate immutable image tag
        id: image
        shell: bash
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ steps.environment.outputs.environment }}-${GITHUB_SHA}"

          echo "Image: ${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image }}"


  # ============================================================
  # STAGE 4 - DEPLOY
  # ============================================================
  deploy:
    name: Stage 4 - Deploy to AKS
    needs: build-and-push
    runs-on: autocare-frontend

    environment:
      name: ${{ needs.build-and-push.outputs.environment }}

    outputs:
      environment: ${{ needs.build-and-push.outputs.environment }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Configure kubelogin
        run: |
          kubelogin convert-kubeconfig -l azurecli

      - name: Render Kustomize overlay
        shell: bash
        run: |
          ENVIRONMENT="${{ needs.build-and-push.outputs.environment }}"

          kubectl kustomize \
            "k8s/overlays/${ENVIRONMENT}" \
            > /tmp/frontend-rendered.yaml

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          ENVIRONMENT="${{ needs.build-and-push.outputs.environment }}"

          kubectl apply \
            -f /tmp/frontend-rendered.yaml \
            -n "${ENVIRONMENT}"

      - name: Set deployed image
        shell: bash
        run: |
          ENVIRONMENT="${{ needs.build-and-push.outputs.environment }}"

          kubectl set image \
            deployment/autocare-frontend \
            frontend="${{ needs.build-and-push.outputs.image }}" \
            -n "${ENVIRONMENT}"


  # ============================================================
  # STAGE 5 - VERIFY
  # ============================================================
  verify:
    name: Stage 5 - Verify
    needs: deploy
    runs-on: autocare-frontend

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Configure kubelogin
        run: |
          kubelogin convert-kubeconfig -l azurecli

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/autocare-frontend \
            -n "${{ needs.deploy.outputs.environment }}" \
            --timeout=5m

      - name: Check deployment
        run: |
          kubectl get deployment \
            autocare-frontend \
            -n "${{ needs.deploy.outputs.environment }}"

      - name: Check pods
        run: |
          kubectl get pods \
            -n "${{ needs.deploy.outputs.environment }}" \
            -l app=autocare-frontend