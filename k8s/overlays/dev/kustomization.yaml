apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: autocare

images:
  - name: acrazureproject.azurecr.io/autocare-frontend
    newName: acrazureproject.azurecr.io/autocare-frontend
    newTag: v1
