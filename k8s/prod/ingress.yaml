apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autocare
  namespace: dev
  annotations:
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: autocare-dev-tls
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: azure-application-gateway
  rules:
    - host: dev.autocare.local
      http:
        paths:
          - path: /autocare/
            pathType: Prefix
            backend:
              service:
                name: autocare-frontend
                port:
                  number: 8080
