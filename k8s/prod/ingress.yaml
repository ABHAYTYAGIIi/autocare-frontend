apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autocare
  namespace: prod
spec:
  ingressClassName: azure-application-gateway
  rules:
    - http:
        paths:
          - path: /autocare/
            pathType: Prefix
            backend:
              service:
                name: autocare-frontend
                port:
                  number: 8080
