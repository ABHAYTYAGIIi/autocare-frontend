apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocare-frontend
  namespace: prod
spec:
  selector:
    matchLabels:
      app: autocare-frontend
  template:
    metadata:
      labels:
        app: autocare-frontend
    spec:
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /autocare/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /autocare/
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
