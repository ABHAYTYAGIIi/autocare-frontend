apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autocare
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/app-root: /autocare/
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /autocare/
            pathType: Prefix
            backend:
              service:
                name: autocare-frontend
                port:
                  number: 8080
